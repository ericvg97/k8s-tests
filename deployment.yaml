apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-tests
spec:
  replicas: 10
  selector:
    matchLabels:
      app: k8s-tests
  template:
    metadata:
      labels:
        app: k8s-tests
    spec:
      containers:
        - name: k8s-tests
          image: k8s-tests:${IMAGE_TAG}
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 1
            failureThreshold: 1
            successThreshold: 1
